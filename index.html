<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>RideCoach</title>
<style>
:root { --bg:#FFFBFE; --card:#F3EDF7; --text:#1C1B1F; --muted:#625B71; --line:#E7E0EC; --accent:#6650A4; --on:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#1C1B1F; --card:#2B2930; --text:#E6E1E5; --muted:#CAC4D0; --line:#49454F; --accent:#D0BCFF; --on:#381E72; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
form { width:100%; max-width:360px; background:var(--card); border:0; border-radius:24px; padding:22px; }
.zs { display:flex; height:6px; border-radius:3px; overflow:hidden; margin:0 0 16px; } .zs span { flex:1; }
h1 { margin:0 0 4px; font-size:1.3rem; color:var(--accent); }
p { margin:0 0 14px; color:var(--muted); font-size:.9rem; }
input[type=password], input[type=text] { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); }
label.chk { display:flex; gap:8px; align-items:center; margin:12px 0; font-size:.9rem; color:var(--muted); }
button { width:100%; font:inherit; padding:11px; border:0; border-radius:20px; background:var(--accent); color:var(--on); cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
#msg { min-height:1.4em; margin:10px 0 0; font-size:.88rem; color:#d92d20; }
#msg.ok { color:var(--muted); }
</style>
</head>

</form>

  var KEYSTORE = 'rcp.k';
  var enc = new TextEncoder();
  var $ = function (id) { return document.getElementById(id); };
  var ls = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  var AAD_KEY = enc.encode('rc-key-v1'), AAD_DOC = enc.encode('rc-doc-v1');

  async function kek(pw, salt) {
    var base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: BLOB.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function keyFromPassword(pw) {
    for (var i = 0; i < BLOB.slots.length; i++) {
      var sl = BLOB.slots[i];
      try {
        var K = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(sl.i), additionalData: AAD_KEY }, await kek(pw, unb64(sl.s)), unb64(sl.w));
        return new Uint8Array(K);
      } catch (e) { /* not this slot */ }
    }
    return null;
  }
  async function openWith(K) {
    var key = await crypto.subtle.importKey('raw', K, 'AES-GCM', false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(BLOB.iv), additionalData: AAD_DOC }, key, unb64(BLOB.ct));
    var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }
  function show(html) {
    document.open(); document.write(html); document.close();
    var b = document.createElement('button');
    b.textContent = 'Forget this device';
    b.title = 'Lock the page and remove the saved unlock from this browser';
    b.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9999;width:auto;padding:6px 10px;font:12px system-ui,sans-serif;border:1px solid #8886;border-radius:8px;background:#fffd;color:#333;cursor:pointer;opacity:.75';
    b.onclick = function () { try { localStorage.removeItem(KEYSTORE); } catch (e) {} location.reload(); };
    document.body.appendChild(b);
  }
  function msg(t, ok) { var m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : ''; }

    msg('This browser cannot decrypt the page. Use a current Chrome, Edge, Safari or Firefox over https.');
    $('go').disabled = true;

    var saved = ls.get(KEYSTORE);
    if (!saved) return;
    try { msg('Unlocking...', true); show(await openWith(unb64(saved))); }
    catch (e) { ls.del(KEYSTORE); msg('The page was updated. Please enter your password again.'); }
  })();

  $('f').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var pw = $('pw').value;
    if (!pw) return;
    $('go').disabled = true; msg('Checking password...', true);
    try {
      var K = await keyFromPassword(pw.trim());
      if (!K) { msg('Wrong password.'); $('go').disabled = false; return; }
      var html = await openWith(K);
      if ($('rem').checked) ls.set(KEYSTORE, b64(K));
      show(html);
    } catch (e) { msg('Could not open the page: ' + (e && e.message || e)); $('go').disabled = false; }
  });
